<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kartly - an online store built with React, Redux Toolkit and React Hook Form." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kartly | Online Store</title>

    <!--
      Yahan ye chhota script React se PEHLE chalta hai.
      Ye saved theme (light/dark) padh kar <html> par laga deta hai,
      taake page reload par achanak white flash na aaye.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kartly:theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage block ho to default light theme chalega */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
